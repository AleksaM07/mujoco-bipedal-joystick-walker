PROJECT-COMMAND-TRACKING-SPLIT:
  type: ENGINEERING_DEFAULT
  source:
    title: "Unit-consistent joystick tracking decomposition"
    authors: null
    year: 2026
    section: null
    equation: null
    url: null
  used_in:
    - "biomechanics_env.py"
    - "config.py"
  adaptation:
    original: >
      Previous project code measured [forward velocity, lateral velocity, yaw
      rate] in a single norm.
    project: >
      Linear velocity tracking and yaw-rate tracking are computed separately
      and then combined with fixed engineering weights.
    reason: >
      m/s and rad/s are different physical units and should not be treated as
      directly interchangeable in one Euclidean error.

BIOHUMANOID-HEADING-FRAME-COMMAND:
  type: MODEL_CALIBRATED
  source:
    title: "MuJoCo humanoid heading-frame command measurement"
    authors: null
    year: 2026
    section: null
    equation: null
    url: null
  used_in:
    - "biomechanics_env.py"
  adaptation:
    original: >
      Previous project code measured command velocity in the full torso local
      frame, including pitch and roll.
    project: >
      Command velocity is measured in a yaw-only horizontal frame derived from
      the torso heading projection.
    reason: >
      Joystick tracking should respond to robot heading, not to transient torso
      pitch/roll tilt.

PROJECT-BVH-FK-RETARGETING:
  type: MODEL_CALIBRATED
  source:
    title: "BVH actuator-target to MuJoCo FK feature adaptation"
    authors: null
    year: 2026
    section: null
    equation: null
    url: null
  used_in:
    - "bvh_reference.py"
    - "biomechanics_env.py"
  adaptation:
    original: >
      The old BVH code returned actuator-space qpos/qvel targets and used them
      directly for imitation-style reward terms.
    project: >
      BVH actuator targets are now treated as an intermediate retargeting
      source. MuJoCo forward kinematics builds body orientation, velocity,
      end-effector, root, and COM targets.
    reason: >
      The project is moving toward DeepMimic-style state features while retaining
      the currently available BVH parser/retargeter.


DEEPMIMIC2018-CODE-IMITATION-REWARD:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/xbpeng/DeepMimic"
    commit: "1f915c52fcd4b95b5f5f15b759ae91bd81e9a801"
    file: "DeepMimicCore/scenes/SceneImitate.cpp"
    lines: "7-124"
    url: "https://github.com/xbpeng/DeepMimic/blob/master/DeepMimicCore/scenes/SceneImitate.cpp"
    related_paper:
      title: "DeepMimic: Example-Guided Deep Reinforcement Learning of Physics-Based Character Skills"
      authors: "Peng, Abbeel, Levine, van de Panne"
      year: 2018
      section: null
      equation: null
      url: "https://xbpeng.github.io/projects/DeepMimic/index.html"
  used_in:
    - "biomechanics_env.py"
  adaptation:
    original: >
      DeepMimic implementation computes a weighted sum of exponential pose,
      velocity, end-effector, root, and COM rewards.
    project: >
      The project computes the same reward-group shape over MuJoCo/MJX body
      quaternions, body velocities, foot end-effectors, root state, and COM
      targets precomputed from BVH-retargeted actuator poses.
    reason: >
      The original Bullet character and motion representation are not the same
      as this MuJoCo humanoid XML, so the reward is adapted to available MJX
      state tensors.
    verified_paper_section: false
    verified_paper_equation: false

MIMICKIT-MOTION-LIBRARY:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/xbpeng/MimicKit"
    commit: "2ed1e6c093bb0829f55d33cb4f7a1731cfe6cb69"
    files:
      - "mimickit/anim/motion.py"
      - "mimickit/anim/motion_lib.py"
    lines: null
    url: "https://github.com/xbpeng/MimicKit"
    license: "Apache-2.0"
  used_in:
    - "bvh_reference.py"
    - "config.py"
  adaptation:
    original: >
      MimicKit stores motion clips with loop mode, fps, frames, motion weights,
      sampled motion time, frame blending, root state, joint rotations, and
      derived velocities.
    project: >
      This repository ports the small motion-library shape needed by the MJX
      trainer: BVH files and BVH lists become weighted clips with frame counts,
      loop modes, root targets, derived velocities, and padded static tensors
      suitable for JAX/MJX compilation.
    reason: >
      Keeps DeepMimic-style imitation always available without adding a separate
      runtime converter script or a second training entrypoint.

MIMICKIT-DEEPMIMIC-HUMANOID-CONFIG:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/xbpeng/MimicKit"
    commit: "2ed1e6c093bb0829f55d33cb4f7a1731cfe6cb69"
    files:
      - "data/envs/deepmimic_humanoid_env.yaml"
      - "data/agents/deepmimic_humanoid_ppo_agent.yaml"
      - "mimickit/envs/deepmimic_env.py"
    lines: null
    url: "https://github.com/xbpeng/MimicKit"
    license: "Apache-2.0"
  used_in:
    - "biomechanics_env.py"
    - "config.py"
  adaptation:
    original: >
      MimicKit's humanoid DeepMimic environment uses weighted exponential
      imitation rewards for pose, velocity, root pose, root velocity, and key
      body positions. Its PPO agent config uses 2x1024 actor/critic networks,
      lr 1e-4, discount 0.99, lambda 0.95, clip ratio 0.2, fixed action std
      0.05, SGD, and zero entropy weight.
    project: >
      This project mirrors the exposed Brax PPO knobs and the reward weights.
      Brax PPO's normal policy exposes a scalar action std initialized to 0.05,
      but keeps it learnable; its public train wrapper also does not expose SGD,
      so strict fixed-std/SGD parity requires a future custom trainer.
    reason: >
      Professor-facing Phase 1 experiments should use the same reward-group
      semantics and published-code hyperparameter scale as DeepMimic/MimicKit.

PROJECT-DEEPMIMIC-STATE-SPACE-FIX:
  type: ENGINEERING_DEFAULT
  source:
    title: "Local audit of Phase 1 BVH/MuJoCo state mismatch"
    date: "2026-08-10"
    files:
      - "runs/20260810_0006_forward_V1_steps-80m_reward-m279p4359_s/train.log"
      - "biomechanics_env.py"
      - "bvh_reference.py"
    url: null
  used_in:
    - "biomechanics_env.py"
    - "bvh_reference.py"
    - "config.py"
  adaptation:
    original: >
      The failed 80m run had terminated=1.0, done_low=1.0, and dm_key=0.0
      throughout evaluation. A reset audit showed BVH-derived key body targets
      in a different coordinate frame than the MuJoCo humanoid.
    project: >
      BVH root orientation is kept in the MuJoCo upright frame until a full
      skeleton retargeter exists; reset now initializes qpos/qvel/root/ctrl from
      one coherent sampled reference frame; policy target observations include
      current/future qpos, qvel, root, and key-body targets; BVH mode makes the
      DeepMimic imitation reward the main positive reward and disables old gait
      foot-slip/swing heuristics that conflict with imitation.
    reason: >
      DeepMimic assumes simulated state and reference motion live in the same
      character state space. These changes make the current heuristic BVH bridge
      internally coherent enough for Phase 1 training diagnostics.

MARINA-BVH-STEP-SEGMENTATION:
  type: PROJECT_COLLABORATOR_DERIVED
  source:
    title: "Local BVH foot-speed step segmentation prototype"
    author: "Marina"
    year: 2026
    files:
      - "marina_bvh_parse/bvh_parse.py"
      - "marina_bvh_parse/new_bvh.py"
      - "marina_bvh_parse/steps.csv"
    url: null
  used_in:
    - "bvh_reference.py"
  adaptation:
    original: >
      The prototype computes BVH global foot positions, filters foot speeds,
      detects contact/heel-strike events, writes step boundaries to CSV, and can
      split a BVH into per-step files.
    project: >
      The runtime loader reads sibling steps.csv files when present, and also
      embeds the same lightweight foot-speed heel-strike idea as an automatic
      fallback segmenter before building MimicKit-style clips.
    reason: >
      Step-sized walking clips are cleaner imitation targets than treating a
      long BVH file as one monolithic reference trajectory.


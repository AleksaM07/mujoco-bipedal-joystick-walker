DEEPMIMIC2018-CODE-IMITATION-REWARD:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/xbpeng/DeepMimic"
    commit: "1f915c52fcd4b95b5f5f15b759ae91bd81e9a801"
    file: "DeepMimicCore/scenes/SceneImitate.cpp"
    lines: "7-124"
    url: "https://github.com/xbpeng/DeepMimic/blob/master/DeepMimicCore/scenes/SceneImitate.cpp"
    related_paper:
      title: "DeepMimic: Example-Guided Deep Reinforcement Learning of Physics-Based Character Skills"
      authors: "Peng, Abbeel, Levine, van de Panne"
      year: 2018
      section: null
      equation: null
      url: "https://xbpeng.github.io/projects/DeepMimic/index.html"
  used_in:
    - "biomechanics_env.py"
  adaptation:
    original: >
      DeepMimic implementation computes a weighted sum of exponential pose,
      velocity, end-effector, root, and COM rewards.
    project: >
      The project computes the same reward-group shape over MuJoCo/MJX body
      quaternions, body velocities, foot end-effectors, root state, and COM
      targets precomputed from BVH-retargeted actuator poses.
    reason: >
      The original Bullet character and motion representation are not the same
      as this MuJoCo humanoid XML, so the reward is adapted to available MJX
      state tensors.
    verified_paper_section: false
    verified_paper_equation: false

BULLET-WARP-BACKEND:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
    commit: "0cd3da8135a7380dfb09c81ff29cba774cb5fdcf"
    file: "phase1_backends.py"
    lines: "1-260"
    url: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
  used_in:
    - "phase1_backends.py"
    - "biomechanics_env.py"
    - "config.py"
    - "train.py"
    - "evaluate.py"
  adaptation:
    original: >
      Reference repository wraps MJX-JAX/MJX-Warp backend selection, validates
      Warp dependencies, resolves GraphMode, and converts host MuJoCo models
      through mjx.put_model(..., impl='warp', graph_mode=...).
    project: >
      This repository makes MJX-Warp the default backend and keeps only the
      small helper surface needed by the current training/evaluation scripts.
    reason: >
      The user requested replacing the current backend path with the MJX-Warp
      approach from the reference repository, without adding a new parallel
      training script.

BULLET-WARP-CONTACT-BUFFERS:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
    commit: "0cd3da8135a7380dfb09c81ff29cba774cb5fdcf"
    file: "biomechanics_env.py"
    lines: "2380-2399"
    url: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
  used_in:
    - "biomechanics_env.py"
    - "train.py"
  adaptation:
    original: >
      Integrated MJX-Warp stores contact arrays on data._impl with world-id
      fields because contact capacity spans all worlds in a batched run.
    project: >
      Foot contact checks read data._impl.contact__geom, contact__dist, and
      contact__worldid when physics_backend is mjx_warp.
    reason: >
      The old MJX-JAX contact API is not the correct data path for batched
      MJX-Warp contact buffers.

MJX-WARP-CAPACITY-DEFAULTS:
  type: REFERENCE_CODE_DERIVED
  source:
    repository: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
    commit: "0cd3da8135a7380dfb09c81ff29cba774cb5fdcf"
    file: "phase1_backends.py"
    lines: "27-73"
    url: "https://github.com/AleksaM07/bipedal-humanoid-bullet-avoidance"
  used_in:
    - "phase1_backends.py"
  adaptation:
    original: >
      Reference code uses eight contacts per world and 64 constraints per world
      as engineering defaults for the humanoid Warp allocation.
    project: >
      Same capacity rule is used when resolving this repository's default
      MJX-Warp data allocation.
    reason: >
      Keeps the Warp data shape large enough for this humanoid while avoiding
      per-run manual capacity settings.


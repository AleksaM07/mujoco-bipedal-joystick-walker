[project]
name = "mujoco-bipedal-joystick-walker"
version = "0.1.0"
description = "Bipedal joystick locomotion training and evaluation with MuJoCo and Brax."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brax>=0.14",
    # CUDA-enabled JAX is required for the default MJX-Warp training path.
    "jax[cuda12]>=0.5.0",
    "loguru>=0.7",
    "ipykernel>=6.30",
    "matplotlib>=3.10",
    "ml-collections>=1.1",
    # REF: PROJECT-WARP-PACKAGE-PINS
    # TYPE: ENGINEERING_DEFAULT
    "mujoco==3.10.0",
    "mujoco-mjx[warp]==3.10.0",
    "warp-lang==1.13.0",
    "nbconvert>=7.16",
    "numpy>=2.0",
    "pandas>=2.3",
    "playground>=0.2.0",
]

[tool.uv]
package = false
